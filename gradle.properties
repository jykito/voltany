# Botania (Forge, MC 1.20.1) — BlameJared maven (https://maven.blamejared.com)
# artifactId is capitalized "Botania", version suffix is UPPERCASE "-FORGE", and a separate ":api" classifier exists.
botania_version=1.20.1-453-FORGE
# Botania's mandatory runtime deps (from its mods.toml): Patchouli + Curios. AutoRegLib is NOT needed on 1.20.1.
patchouli_version=1.20.1-85-FORGE
curios_version=5.14.1+1.20.1


